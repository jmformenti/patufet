# patufet — pull-request (reusable)
#
# Everything patufet does with a pull request, in one workflow: review, then
# fix-review or e2e, then fix-e2e. The stages are the reusable workflows next to
# this file, chained here with `needs:` (decision 11), so the caller has one job
# and a change in the chaining needs no change in the caller.
#
# Inputs: one that means the same in every stage keeps its name (language, model,
# labels...); one that each stage sets differently takes the stage as a prefix
# (review-max-turns, fix-max-turns, e2e-max-turns). The defaults are those of the
# stages (tests/run.sh checks that they match and that every input is passed on).
#
# Caller requirements:
#   on.pull_request.types: [opened, synchronize, ready_for_review, reopened, labeled]
#   permissions: contents: write, pull-requests: write, issues: read,
#                id-token: write, actions: read
#   (each stage narrows them: only fix-review and fix-e2e can write contents)
name: patufet / pull-request

on:
  workflow_call:
    inputs:
      e2e:
        description: Run the live e2e stage after a pass (needs the e2e hooks, see docs/e2e.md)
        type: boolean
        default: false
      human-reviewer:
        description: GitHub login (without @) to mention when a person is needed (a CI failure unrelated to the diff, the cycle limit, a fix that pushes nothing) or when everything passed, so they merge
        type: string
        default: ''
      branch-prefix:
        description: Branch prefix used by implement.yml, to find the linked issue
        type: string
        default: agent/issue-
      language:
        description: Language for the comments Claude writes (free text or ISO code)
        type: string
        default: en
      model:
        description: Claude model override, for every stage (empty = action default)
        type: string
        default: ''
      allowed-bots:
        description: Bots whose events may trigger a stage (the implementer and fix-review act as "claude")
        type: string
        default: claude
      claude-args-extra:
        description: Extra arguments appended to claude_args, in every stage
        type: string
        default: ''
      show-full-output:
        description: Show the full Claude transcript in the job logs (may leak secrets printed by tools)
        type: boolean
        default: true
      label-pass:
        description: Verdict label "pass" (a person adding it starts e2e)
        type: string
        default: pass
      label-warning:
        description: Verdict label "warning" (a person adding it starts fix-review)
        type: string
        default: warning
      label-fail:
        description: Verdict label "fail" (a person adding it starts fix-review)
        type: string
        default: fail
      label-needs-human-review:
        description: Label for PRs that need a human (removed on pass)
        type: string
        default: needs-human-review
      review-extra-instructions-file:
        description: review — path (in the consumer repo) of a Markdown file appended to the base prompt (project review checklist)
        type: string
        default: .github/patufet/review.md
      ci-wait-timeout-minutes:
        description: review — maximum wait for the CI of the PR's commit. When it ends the review runs anyway and reports that CI has not finished
        type: number
        default: 30
      review-max-turns:
        description: review — --max-turns for the agent
        type: number
        default: 400
      review-allowed-tools:
        description: review — --allowedTools for the agent. gh runs with the Claude App token, which can write; keep this list to reading and commenting
        type: string
        default: Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment
      review-timeout-minutes:
        description: review — timeout, not counting the wait for CI
        type: number
        default: 30
      max-review-cycles:
        description: Maximum number of automatic review reports before asking for a human
        type: number
        default: 10
      java-version:
        description: fix-review and fix-e2e — Java version to set up on the runner (actions/setup-java, Temurin), to match CI. Empty = the runner's default
        type: string
        default: ''
      node-version:
        description: fix-review and fix-e2e — Node.js version to set up on the runner (actions/setup-node), to match CI. Empty = the runner's default
        type: string
        default: ''
      fix-extra-instructions-file:
        description: fix-review and fix-e2e — path (in the consumer repo) of a Markdown file appended to the base prompt
        type: string
        default: .github/patufet/implement.md
      fix-max-turns:
        description: fix-review and fix-e2e — --max-turns for the agent
        type: number
        default: 400
      fix-allowed-tools:
        description: fix-review and fix-e2e — --allowedTools for the agent
        type: string
        default: Bash,Edit,Write,Read,Glob,Grep
      fix-timeout-minutes:
        description: fix-review and fix-e2e — job timeout
        type: number
        default: 45
      e2e-up-script:
        description: e2e — script (in the consumer repo) that starts the app, waits for it and seeds test data. Must write KEY=VALUE lines (URLs, test credentials) to $PATUFET_E2E_ENV
        type: string
        default: .github/patufet/e2e-up.sh
      e2e-down-script:
        description: e2e — script that stops the app; always runs
        type: string
        default: .github/patufet/e2e-down.sh
      e2e-extra-instructions-file:
        description: e2e — what to test for this project (appended to the base prompt)
        type: string
        default: .github/patufet/e2e.md
      e2e-max-turns:
        description: e2e — --max-turns for the agent
        type: number
        default: 200
      e2e-allowed-tools:
        description: e2e — --allowedTools for the agent. gh runs with the Claude App token, which can write (and merge); keep this list to reading and commenting
        type: string
        default: mcp__playwright__*,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)
      install-playwright:
        description: e2e — install the Playwright Chromium browser on the runner
        type: boolean
        default: true
      playwright-mcp-version:
        description: e2e — version of @playwright/mcp; the browser installed is the one of the Playwright version it depends on
        type: string
        default: 0.0.82
      e2e-timeout-minutes:
        description: e2e — job timeout
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  # every push to a non-draft PR → wait for the CI of the commit, review, verdict label
  review:
    if: |
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","ready_for_review","reopened"]'), github.event.action) &&
      github.event.pull_request.draft == false
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # the CI runs of the commit and the logs of failed jobs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      extra-instructions-file: ${{ inputs.review-extra-instructions-file }}
      ci-wait-timeout-minutes: ${{ inputs.ci-wait-timeout-minutes }}
      human-reviewer: ${{ inputs.human-reviewer }}
      branch-prefix: ${{ inputs.branch-prefix }}
      language: ${{ inputs.language }}
      model: ${{ inputs.model }}
      max-turns: ${{ inputs.review-max-turns }}
      allowed-tools: ${{ inputs.review-allowed-tools }}
      allowed-bots: ${{ inputs.allowed-bots }}
      claude-args-extra: ${{ inputs.claude-args-extra }}
      show-full-output: ${{ inputs.show-full-output }}
      label-pass: ${{ inputs.label-pass }}
      label-warning: ${{ inputs.label-warning }}
      label-fail: ${{ inputs.label-fail }}
      label-needs-human-review: ${{ inputs.label-needs-human-review }}
      timeout-minutes: ${{ inputs.review-timeout-minutes }}

  # review says warning / fail, or a person adds that label → apply the review and
  # push, which starts a new review
  fix-review:
    needs: review
    if: |
      !cancelled() && (
        needs.review.outputs.next-stage == 'fix-review' ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
         (github.event.label.name == inputs.label-warning || github.event.label.name == inputs.label-fail)))
    uses: ./.github/workflows/fix-review.yml
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      max-review-cycles: ${{ inputs.max-review-cycles }}
      java-version: ${{ inputs.java-version }}
      node-version: ${{ inputs.node-version }}
      human-reviewer: ${{ inputs.human-reviewer }}
      extra-instructions-file: ${{ inputs.fix-extra-instructions-file }}
      language: ${{ inputs.language }}
      model: ${{ inputs.model }}
      max-turns: ${{ inputs.fix-max-turns }}
      allowed-tools: ${{ inputs.fix-allowed-tools }}
      allowed-bots: ${{ inputs.allowed-bots }}
      claude-args-extra: ${{ inputs.claude-args-extra }}
      show-full-output: ${{ inputs.show-full-output }}
      label-needs-human-review: ${{ inputs.label-needs-human-review }}
      timeout-minutes: ${{ inputs.fix-timeout-minutes }}

  # review says pass, or a person adds that label → start the app and test it live
  e2e:
    needs: review
    if: |
      inputs.e2e && !cancelled() && (
        needs.review.outputs.next-stage == 'e2e' ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
         github.event.label.name == inputs.label-pass))
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      up-script: ${{ inputs.e2e-up-script }}
      down-script: ${{ inputs.e2e-down-script }}
      extra-instructions-file: ${{ inputs.e2e-extra-instructions-file }}
      human-reviewer: ${{ inputs.human-reviewer }}
      branch-prefix: ${{ inputs.branch-prefix }}
      language: ${{ inputs.language }}
      model: ${{ inputs.model }}
      max-turns: ${{ inputs.e2e-max-turns }}
      allowed-tools: ${{ inputs.e2e-allowed-tools }}
      allowed-bots: ${{ inputs.allowed-bots }}
      claude-args-extra: ${{ inputs.claude-args-extra }}
      show-full-output: ${{ inputs.show-full-output }}
      install-playwright: ${{ inputs.install-playwright }}
      playwright-mcp-version: ${{ inputs.playwright-mcp-version }}
      label-pass: ${{ inputs.label-pass }}
      label-warning: ${{ inputs.label-warning }}
      label-fail: ${{ inputs.label-fail }}
      timeout-minutes: ${{ inputs.e2e-timeout-minutes }}

  # e2e failed → apply its report, like fix-review
  fix-e2e:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.outputs.next-stage == 'fix-review' }}
    uses: ./.github/workflows/fix-review.yml
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      max-review-cycles: ${{ inputs.max-review-cycles }}
      java-version: ${{ inputs.java-version }}
      node-version: ${{ inputs.node-version }}
      human-reviewer: ${{ inputs.human-reviewer }}
      extra-instructions-file: ${{ inputs.fix-extra-instructions-file }}
      language: ${{ inputs.language }}
      model: ${{ inputs.model }}
      max-turns: ${{ inputs.fix-max-turns }}
      allowed-tools: ${{ inputs.fix-allowed-tools }}
      allowed-bots: ${{ inputs.allowed-bots }}
      claude-args-extra: ${{ inputs.claude-args-extra }}
      show-full-output: ${{ inputs.show-full-output }}
      label-needs-human-review: ${{ inputs.label-needs-human-review }}
      timeout-minutes: ${{ inputs.fix-timeout-minutes }}
