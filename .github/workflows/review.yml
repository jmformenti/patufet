# patufet — review
#
# Reviews a pull request, posts inline comments plus one report comment
# (marker "<!-- patufet:review -->"), then a deterministic step labels the PR
# with the verdict (pass / warning / fail) and returns the stage that follows,
# which the caller starts with `needs:` (decision 11). Claude never sets labels.
name: patufet / review

on:
  workflow_call:
    inputs:
      extra-instructions-file:
        description: Path (in the consumer repo) of a Markdown file appended to the base prompt (project review checklist)
        type: string
        default: .github/patufet/review.md
      ci-wait-timeout-minutes:
        description: Maximum wait for the CI of the PR's commit. When it ends the review runs anyway and reports that CI has not finished
        type: number
        default: 30
      human-reviewer:
        description: GitHub login (without @) to mention when a CI failure needs a person (unrelated to the diff, or the workflow had to force the verdict)
        type: string
        default: ''
      branch-prefix:
        description: Branch prefix used by implement.yml, to find the linked issue
        type: string
        default: agent/issue-
      language:
        description: Language for the comments Claude writes (free text or ISO code)
        type: string
        default: en
      model:
        description: Claude model override (empty = action default)
        type: string
        default: ''
      max-turns:
        description: --max-turns for the agent
        type: number
        default: 400
      allowed-tools:
        description: --allowedTools for the agent. gh runs with the Claude App token, which can write; keep this list to reading and commenting
        type: string
        default: Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment
      allowed-bots:
        description: Bots whose PRs may trigger the review (the implementer opens PRs as "claude")
        type: string
        default: claude
      claude-args-extra:
        description: Extra arguments appended to claude_args
        type: string
        default: ''
      show-full-output:
        description: Show the full Claude transcript in the job log (may leak secrets printed by tools)
        type: boolean
        default: true
      label-pass:
        description: Verdict label "pass"
        type: string
        default: pass
      label-warning:
        description: Verdict label "warning"
        type: string
        default: warning
      label-fail:
        description: Verdict label "fail"
        type: string
        default: fail
      label-needs-human-review:
        description: Label for PRs that need a human (removed on pass)
        type: string
        default: needs-human-review
      timeout-minutes:
        description: Timeout of the review, not counting the wait for CI
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
    outputs:
      verdict:
        description: The verdict label set, pass, warning or fail (empty when none was set)
        value: ${{ jobs.review.outputs.verdict }}
      next-stage:
        description: The stage the caller starts with `needs:`, fix-review or e2e (empty when none)
        value: ${{ jobs.review.outputs.next-stage }}

jobs:
  review:
    runs-on: ubuntu-latest
    # Expressions have no arithmetic to add the wait to the review: the wait and the
    # Claude step are bounded one by one, and this is only GitHub's own limit for a job
    timeout-minutes: 360
    # A review of a superseded diff must never label after a newer one. This also
    # cancels a review still waiting for the CI of the previous push.
    concurrency:
      group: patufet-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # No `permissions:` on purpose, the job takes those of the caller's job: declaring
    # them here could only ask for more than the caller grants.
    # Needs: contents read, pull-requests write, issues read, id-token write and
    # actions read, for the runs and logs of CI (docs/security.md, decisions 10, 12).
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      next-stage: ${{ steps.verdict.outputs.next-stage }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL_PASS: ${{ inputs.label-pass }}
      LABEL_WARNING: ${{ inputs.label-warning }}
      LABEL_FAIL: ${{ inputs.label-fail }}
      LABEL_NHR: ${{ inputs.label-needs-human-review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch patufet template
        run: |
          TPL_DIR="$RUNNER_TEMP/patufet"
          mkdir -p "$TPL_DIR"
          gh api "repos/$TEMPLATE_REPO/tarball/$TEMPLATE_SHA" > "$RUNNER_TEMP/template.tar.gz"
          tar -xzf "$RUNNER_TEMP/template.tar.gz" -C "$TPL_DIR" --strip-components=1
          rm -f "$RUNNER_TEMP/template.tar.gz"
          echo "TPL_DIR=$TPL_DIR" >> "$GITHUB_ENV"
          echo "patufet template $TEMPLATE_REPO@$TEMPLATE_SHA extracted to $TPL_DIR"
        env:
          TEMPLATE_REPO: ${{ job.workflow_repository }}
          TEMPLATE_SHA: ${{ job.workflow_sha }}

      - name: Gather context (linked issue, approved plan, cycle number)
        id: context
        env:
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        run: |
          "$TPL_DIR/scripts/gather-context.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$BRANCH_PREFIX" review "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          cycles=$("$TPL_DIR/scripts/count-review-cycles.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER")
          echo "cycle=$((cycles + 1))" >> "$GITHUB_OUTPUT"

      # Existing labels are left as the repository configured them.
      - name: Ensure the verdict labels exist
        run: '"$TPL_DIR/scripts/ensure-labels.sh" "$LABEL_PASS=0E8A16" "$LABEL_WARNING=FBCA04" "$LABEL_FAIL=B60205" "$LABEL_NHR=5319E7"'

      # Until the new verdict the PR has none: the old one was for older code.
      # GITHUB_TOKEN events start nothing. A fork PR has a read-only token, and its
      # review fails at the Claude step anyway.
      - name: Remove the previous verdict label
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: gh pr edit "$PR_NUMBER" --remove-label "$LABEL_PASS" --remove-label "$LABEL_WARNING" --remove-label "$LABEL_FAIL"

      # The CI is every workflow that runs on this commit for the PR, except the
      # caller's own (decision 12). A fork PR has no secrets, so its review fails at
      # the Claude step: no point in idling first
      - name: Wait for the CI of the commit
        id: ci
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CALLER_REF: ${{ github.workflow_ref }}
          CI_WAIT_MINUTES: ${{ inputs.ci-wait-timeout-minutes }}
        run: |
          own=${CALLER_REF#"$GITHUB_REPOSITORY"/}
          own=${own%%@*}
          "$TPL_DIR/scripts/wait-for-ci.sh" "$GITHUB_REPOSITORY" "$HEAD_SHA" "$own" "$CI_WAIT_MINUTES" "$RUNNER_TEMP/ci-result.json" >> "$GITHUB_OUTPUT"

      - name: Render the prompt
        id: prompt
        env:
          TPL_pr: ${{ github.event.pull_request.number }}
          TPL_repository: ${{ github.repository }}
          TPL_cycle: ${{ steps.context.outputs.cycle }}
          TPL_language: ${{ inputs.language }}
          TPL_human_reviewer: ${{ inputs.human-reviewer != '' && format('@{0}', inputs.human-reviewer) || 'none is configured, so mention nobody' }}
          EXTRA_FILE: ${{ inputs.extra-instructions-file }}
        run: |
          TPL_plan_section="$(cat "$RUNNER_TEMP/plan_section.md")"; export TPL_plan_section
          TPL_ci_section="$("$TPL_DIR/scripts/ci-section.sh" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/ci-result.json")"; export TPL_ci_section
          "$TPL_DIR/scripts/render-prompt.sh" "$TPL_DIR/prompts/review.md" "$EXTRA_FILE" \
            | "$TPL_DIR/scripts/github-output.sh" text

      # Direct prompt instead of the code-review plugin: the plugin spawns
      # parallel subagents and in non-interactive CI mode the main turn ends
      # before they report back
      - name: Run Claude Code review
        id: claude
        timeout-minutes: ${{ inputs.timeout-minutes }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ inputs.allowed-bots }}
          show_full_output: ${{ inputs.show-full-output }}
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "${{ inputs.allowed-tools }}"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","warning","fail"]},"summary":{"type":"string"},"needs_human":{"type":"boolean"}},"required":["verdict","summary"]}'
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.claude-args-extra }}
          prompt: ${{ steps.prompt.outputs.text }}

      # The state is set here, never by Claude: the verdict label, with GITHUB_TOKEN
      # (it starts nothing), and the `next-stage` output, which the caller's
      # fix-review / e2e jobs read with `needs:` (decision 11).
      # Not on cancellation: a superseded review must never label.
      - name: Apply the verdict
        id: verdict
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CYCLE: ${{ steps.context.outputs.cycle }}
          CI_STATE: ${{ steps.ci.outputs.state }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: ${{ inputs.human-reviewer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No execution file = the action skipped itself before running Claude
          # (e.g. its workflow-file validation on the PR that first adds the
          # workflow) or the step timed out. Nothing to label; just fail visibly.
          if [ -z "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::error::The Claude action did not finish (see its step log: workflow validation, missing token, timeout...). No verdict."
            exit 1
          fi
          verdict=$("$TPL_DIR/scripts/read-verdict.sh" review "$GITHUB_REPOSITORY" "$PR_NUMBER" "cycle=$CYCLE")
          needs_human=$(jq -rn --arg s "${STRUCTURED:-}" '$s | try (fromjson | .needs_human == true) catch false')
          head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          moved=false
          [ "$head" = "$HEAD_SHA" ] || moved=true
          route=$("$TPL_DIR/scripts/route-review.sh" "$verdict" "$CI_STATE" "$needs_human" "$moved")
          echo "$route" >> "$GITHUB_OUTPUT"
          label=$(sed -n 's/^verdict=//p' <<< "$route")
          nhr=$(sed -n 's/^needs-human=//p' <<< "$route")
          mention=""
          [ -n "$REVIEWER" ] && mention=" @$REVIEWER"
          case "$(sed -n 's/^reason=//p' <<< "$route")" in
            moved)
              echo "The PR has moved on from ${HEAD_SHA:0:7} to ${head:0:7}; the review of the new commit sets the state." ;;
            no-verdict)
              gh pr edit "$PR_NUMBER" --add-label "$LABEL_NHR"
              gh pr comment "$PR_NUMBER" --body "⚠️ patufet: review cycle $CYCLE produced no verdict. Manual review needed. See $RUN_URL"
              exit 1 ;;
            forced-fail)
              echo "::warning::The reviewer returned 'pass' on a failed CI; the verdict is forced to 'fail'"
              "$TPL_DIR/scripts/set-verdict-label.sh" "$PR_NUMBER" fail "$LABEL_PASS" "$LABEL_WARNING" "$LABEL_FAIL" "$LABEL_NHR" true
              gh pr comment "$PR_NUMBER" --body "⚠️ patufet: the reviewer returned \`pass\` although CI failed, so the workflow set \`$LABEL_FAIL\`. The report asks for no change, so no fix starts on its own: fix the cause, or remove and re-add \`$LABEL_FAIL\` to let fix-review try.$mention" ;;
            *)
              "$TPL_DIR/scripts/set-verdict-label.sh" "$PR_NUMBER" "$label" "$LABEL_PASS" "$LABEL_WARNING" "$LABEL_FAIL" "$LABEL_NHR" "$nhr" ;;
          esac

      - name: Summary
        if: always() && env.TPL_DIR != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CYCLE: ${{ steps.context.outputs.cycle }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          CI_STATE: ${{ steps.ci.outputs.state }}
        run: '"$TPL_DIR/scripts/run-summary.sh" review "$EXECUTION_FILE" "PR: #$PR_NUMBER" "Cycle: $CYCLE" "CI: ${CI_STATE:-not waited for}" "Verdict: ${VERDICT:-none}"'
