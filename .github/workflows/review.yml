# patufet — review
#
# Reviews a pull request, posts inline comments plus one report comment
# (marker "<!-- patufet:review -->") and labels the PR with a verdict
# (pass / warning / fail). The verdict is extracted deterministically from
# Claude's structured output — no second model run to label.
name: patufet / review

on:
  workflow_call:
    inputs:
      extra-instructions-file:
        description: Path (in the consumer repo) of a Markdown file appended to the base prompt (project review checklist)
        type: string
        default: .github/patufet/review.md
      ci-check-names:
        description: Human description of the CI checks that already run tests/build on the PR (so the reviewer does not try to)
        type: string
        default: ''
      branch-prefix:
        description: Branch prefix used by implement.yml, to find the linked issue
        type: string
        default: agent/issue-
      language:
        description: Language for the comments Claude writes (free text or ISO code)
        type: string
        default: en
      model:
        description: Claude model override (empty = action default)
        type: string
        default: ''
      max-turns:
        description: --max-turns for the agent
        type: number
        default: 400
      allowed-tools:
        description: --allowedTools for the agent. gh runs with the Claude App token, which can write; keep this list to reading, commenting and labelling
        type: string
        default: Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment
      allowed-bots:
        description: Bots whose PRs may trigger the review (the implementer opens PRs as "claude")
        type: string
        default: claude
      claude-args-extra:
        description: Extra arguments appended to claude_args
        type: string
        default: ''
      show-full-output:
        description: Show the full Claude transcript in the job log (may leak secrets printed by tools)
        type: boolean
        default: true
      label-pass:
        description: Verdict label "pass" (starts e2e)
        type: string
        default: pass
      label-warning:
        description: Verdict label "warning" (starts fix-review)
        type: string
        default: warning
      label-fail:
        description: Verdict label "fail" (starts fix-review)
        type: string
        default: fail
      label-needs-human-review:
        description: Label for PRs that need a human (removed on pass)
        type: string
        default: needs-human-review
      legacy-plan-heading:
        description: Also accept plan comments containing this heading (migration aid). Empty = marker only
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
    outputs:
      verdict:
        description: pass, warning or fail
        value: ${{ jobs.review.outputs.verdict }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A review of a superseded diff must never label after a newer one
    concurrency:
      group: patufet-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL_PASS: ${{ inputs.label-pass }}
      LABEL_WARNING: ${{ inputs.label-warning }}
      LABEL_FAIL: ${{ inputs.label-fail }}
      LABEL_NHR: ${{ inputs.label-needs-human-review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch patufet template
        run: |
          TPL_DIR="$RUNNER_TEMP/patufet"
          mkdir -p "$TPL_DIR"
          gh api "repos/$TEMPLATE_REPO/tarball/$TEMPLATE_SHA" > "$RUNNER_TEMP/template.tar.gz"
          tar -xzf "$RUNNER_TEMP/template.tar.gz" -C "$TPL_DIR" --strip-components=1
          rm -f "$RUNNER_TEMP/template.tar.gz"
          echo "TPL_DIR=$TPL_DIR" >> "$GITHUB_ENV"
          echo "patufet template $TEMPLATE_REPO@$TEMPLATE_SHA extracted to $TPL_DIR"
        env:
          TEMPLATE_REPO: ${{ job.workflow_repository }}
          TEMPLATE_SHA: ${{ job.workflow_sha }}

      - name: Gather context (linked issue, approved plan, cycle number)
        id: context
        env:
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          LEGACY_HEADING: ${{ inputs.legacy-plan-heading }}
        run: |
          "$TPL_DIR/scripts/gather-context.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$BRANCH_PREFIX" "$LEGACY_HEADING" review "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          cycles=$("$TPL_DIR/scripts/count-review-cycles.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER")
          echo "cycle=$((cycles + 1))" >> "$GITHUB_OUTPUT"

      # Claude labels the PR itself, so the labels must exist before it runs.
      # Existing labels are left as the repository configured them.
      - name: Ensure the verdict labels exist
        run: '"$TPL_DIR/scripts/ensure-labels.sh" "$LABEL_PASS=0E8A16" "$LABEL_WARNING=FBCA04" "$LABEL_FAIL=B60205" "$LABEL_NHR=5319E7"'

      - name: Render the prompt
        id: prompt
        env:
          TPL_pr: ${{ github.event.pull_request.number }}
          TPL_repository: ${{ github.repository }}
          TPL_cycle: ${{ steps.context.outputs.cycle }}
          TPL_language: ${{ inputs.language }}
          TPL_label_pass: ${{ inputs.label-pass }}
          TPL_label_warning: ${{ inputs.label-warning }}
          TPL_label_fail: ${{ inputs.label-fail }}
          TPL_label_needs_human_review: ${{ inputs.label-needs-human-review }}
          CI_CHECKS: ${{ inputs.ci-check-names }}
          EXTRA_FILE: ${{ inputs.extra-instructions-file }}
        run: |
          TPL_plan_section="$(cat "$RUNNER_TEMP/plan_section.md")"; export TPL_plan_section
          if [ -n "$CI_CHECKS" ]; then
            TPL_ci_section="You cannot run tests or builds. The following CI checks already do it on every PR and their result is visible in the PR checks: $CI_CHECKS. Base your assessment of tests on reading the diff only."
          else
            TPL_ci_section="You cannot run tests or builds; base your assessment of tests on reading the diff only."
          fi
          export TPL_ci_section
          "$TPL_DIR/scripts/render-prompt.sh" "$TPL_DIR/prompts/review.md" "$EXTRA_FILE" \
            | "$TPL_DIR/scripts/github-output.sh" text

      # Direct prompt instead of the code-review plugin: the plugin spawns
      # parallel subagents and in non-interactive CI mode the main turn ends
      # before they report back
      - name: Run Claude Code review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ inputs.allowed-bots }}
          show_full_output: ${{ inputs.show-full-output }}
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "${{ inputs.allowed-tools }}"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","warning","fail"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.claude-args-extra }}
          prompt: ${{ steps.prompt.outputs.text }}

      # The verdict label is applied by Claude *inside* the action (with the
      # app token, so the `labeled` event triggers fix-review / e2e); the app
      # token is revoked when the action ends, and GITHUB_TOKEN events never
      # trigger workflows. This step only verifies the label against the
      # verdict of *this* cycle and repairs the state (without triggering).
      # Not on cancellation: a superseded review must never label.
      - name: Verify the verdict label
        id: verdict
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CYCLE: ${{ steps.context.outputs.cycle }}
        run: |
          # No execution file = the action skipped itself before running Claude
          # (e.g. its workflow-file validation on the PR that first adds the
          # workflow). Nothing to label; just fail visibly.
          if [ -z "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::error::The Claude action did not run (see its step log: workflow validation, missing token...). No verdict."
            exit 1
          fi
          verdict=$("$TPL_DIR/scripts/read-verdict.sh" review "$GITHUB_REPOSITORY" "$PR_NUMBER" "cycle=$CYCLE")
          if [ -z "$verdict" ]; then
            gh pr edit "$PR_NUMBER" --add-label "$LABEL_NHR"
            gh pr comment "$PR_NUMBER" --body "⚠️ patufet: review cycle $CYCLE produced no verdict. Manual review needed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          case "$verdict" in
            pass) expected="$LABEL_PASS" ;; warning) expected="$LABEL_WARNING" ;; fail) expected="$LABEL_FAIL" ;;
          esac
          current=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if [ "$(grep -xF -e "$LABEL_PASS" -e "$LABEL_WARNING" -e "$LABEL_FAIL" <<< "$current" || true)" = "$expected" ]; then
            echo "Verdict '$verdict' and label '$expected' agree."
          else
            echo "::warning::Label mismatch (verdict '$verdict', labels '$(tr '\n' ',' <<< "$current")'); repairing with GITHUB_TOKEN — the next stage will NOT be triggered automatically"
            "$TPL_DIR/scripts/set-verdict-label.sh" "$PR_NUMBER" "$verdict" "$LABEL_PASS" "$LABEL_WARNING" "$LABEL_FAIL" "$LABEL_NHR"
            gh pr comment "$PR_NUMBER" --body "⚠️ patufet: the reviewer returned verdict \`$verdict\` but did not label the PR itself; the label was repaired by the workflow, which cannot trigger the next stage. Remove and re-add the \`$expected\` label by hand to continue."
          fi

      - name: Summary
        if: always() && env.TPL_DIR != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CYCLE: ${{ steps.context.outputs.cycle }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: '"$TPL_DIR/scripts/run-summary.sh" review "$EXECUTION_FILE" "PR: #$PR_NUMBER" "Cycle: $CYCLE" "Verdict: ${VERDICT:-none}"'
