# patufet — implement
#
# Turns an issue with an approved plan into a pull request. Called by the
# consumer repository when the "ready-to-implement" label is added (or via
# workflow_dispatch). See docs/architecture.md for the full state machine.
name: patufet / implement

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue to implement (must have an approved plan comment)
        type: number
        required: true
      branch-prefix:
        description: Branch name prefix; the issue number is appended
        type: string
        default: agent/issue-
      java-version:
        description: Deprecated, use .github/patufet/setup/action.yml. Java version to set up on the runner (actions/setup-java, Temurin), to match CI. Empty = the runner's default
        type: string
        default: ''
      node-version:
        description: Deprecated, use .github/patufet/setup/action.yml. Node.js version to set up on the runner (actions/setup-node), to match CI. Empty = the runner's default
        type: string
        default: ''
      extra-instructions-file:
        description: Path (in the consumer repo) of a Markdown file appended to the base prompt
        type: string
        default: .github/patufet/implement.md
      language:
        description: Language for the comments and PR descriptions Claude writes (free text or ISO code)
        type: string
        default: en
      model:
        description: Claude model (empty = patufet's default for this stage, claude-opus-5-5)
        type: string
        default: ''
      max-turns:
        description: --max-turns for the agent
        type: number
        default: 400
      allowed-tools:
        description: --allowedTools for the agent
        type: string
        default: Bash,Edit,Write,Read,Glob,Grep
      claude-args-extra:
        description: Extra arguments appended to claude_args
        type: string
        default: ''
      show-full-output:
        description: Show the full Claude transcript in the job log (may leak secrets printed by tools)
        type: boolean
        default: true
      label-in-progress:
        description: Label set on the issue while the implementer runs
        type: string
        default: in-progress
      label-ready:
        description: Label that starts the implementer (removed when it starts)
        type: string
        default: ready-to-implement
      label-to-refine:
        description: Label the implementer sets on the issue when it has a question
        type: string
        default: to-refine
      label-blocked:
        description: Label set on the issue when the run fails or produces nothing
        type: string
        default: blocked
      timeout-minutes:
        description: Job timeout
        type: number
        default: 45
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One queue per issue: different issues run in parallel, the same issue never twice at once
    concurrency:
      group: patufet-implement-${{ github.repository }}-${{ inputs.issue-number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue-number }}
      BRANCH: ${{ inputs.branch-prefix }}${{ inputs.issue-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Prompts and helper scripts come from the template repo at the exact
      # commit of this reusable workflow (job.workflow_* identity), extracted
      # outside the workspace so the agent can never commit them
      - name: Fetch patufet template
        run: |
          TPL_DIR="$RUNNER_TEMP/patufet"
          mkdir -p "$TPL_DIR"
          gh api "repos/$TEMPLATE_REPO/tarball/$TEMPLATE_SHA" > "$RUNNER_TEMP/template.tar.gz"
          tar -xzf "$RUNNER_TEMP/template.tar.gz" -C "$TPL_DIR" --strip-components=1
          rm -f "$RUNNER_TEMP/template.tar.gz"
          echo "TPL_DIR=$TPL_DIR" >> "$GITHUB_ENV"
          echo "patufet template $TEMPLATE_REPO@$TEMPLATE_SHA extracted to $TPL_DIR"
        env:
          TEMPLATE_REPO: ${{ job.workflow_repository }}
          TEMPLATE_SHA: ${{ job.workflow_sha }}

      # The steps below and the agent set these labels; a repository that renamed
      # them, or never ran the bootstrap, may lack one. Existing labels are left as they are.
      - name: Ensure the issue labels exist
        env:
          LABEL_READY: ${{ inputs.label-ready }}
          LABEL_IN_PROGRESS: ${{ inputs.label-in-progress }}
          LABEL_TO_REFINE: ${{ inputs.label-to-refine }}
          LABEL_BLOCKED: ${{ inputs.label-blocked }}
        run: '"$TPL_DIR/scripts/ensure-labels.sh" "$LABEL_READY=0E8A16" "$LABEL_IN_PROGRESS=FBCA04" "$LABEL_TO_REFINE=D93F0B" "$LABEL_BLOCKED=5319E7"'

      # Only a plan written by a collaborator is trusted (see docs/security.md)
      - name: Extract the approved plan
        id: plan
        env:
          LABEL_BLOCKED: ${{ inputs.label-blocked }}
          LABEL_READY: ${{ inputs.label-ready }}
        run: |
          if ! "$TPL_DIR/scripts/find-plan.sh" "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" > "$RUNNER_TEMP/plan.md"; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "$LABEL_READY" --add-label "$LABEL_BLOCKED"
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ patufet: no approved plan found. The plan must be a comment containing \`<!-- patufet:plan -->\` written by a repository collaborator. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

      # A restart after to-refine clears it: a stale to-refine would pass the PR check below
      - name: Mark the issue as in progress
        env:
          LABEL_READY: ${{ inputs.label-ready }}
          LABEL_IN_PROGRESS: ${{ inputs.label-in-progress }}
          LABEL_TO_REFINE: ${{ inputs.label-to-refine }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "$LABEL_READY" --remove-label "$LABEL_TO_REFINE" --add-label "$LABEL_IN_PROGRESS"

      - name: Set up Java
        if: inputs.java-version != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          # Only selects Node.js. The automatic cache fails without a lockfile at the
          # root, and setup-node advises against it in jobs with elevated privileges
          package-manager-cache: false

      # The project's own setup (runtimes, tools, dependencies): a composite action at a
      # fixed path, as `uses:` takes no expression (scripts/project-setup.sh). Before the
      # git credentials, and without the job's token in its environment
      - name: Decide on the project setup
        id: setup-plan
        run: '"$TPL_DIR/scripts/project-setup.sh" .github/patufet/setup >> "$GITHUB_OUTPUT"'

      - name: Set up the project (.github/patufet/setup)
        id: setup
        if: steps.setup-plan.outputs.run == 'true'
        uses: ./.github/patufet/setup
        env:
          GH_TOKEN: ""

      # persist-credentials is false on checkout; git pushes use gh as credential helper
      - name: Configure git credentials for push
        run: gh auth setup-git

      - name: Render the prompt
        id: prompt
        env:
          TPL_issue: ${{ inputs.issue-number }}
          TPL_repository: ${{ github.repository }}
          TPL_branch: ${{ inputs.branch-prefix }}${{ inputs.issue-number }}
          TPL_language: ${{ inputs.language }}
          TPL_label_in_progress: ${{ inputs.label-in-progress }}
          TPL_label_to_refine: ${{ inputs.label-to-refine }}
          EXTRA_FILE: ${{ inputs.extra-instructions-file }}
        run: |
          TPL_plan="$(cat "$RUNNER_TEMP/plan.md")"; export TPL_plan
          "$TPL_DIR/scripts/render-prompt.sh" "$TPL_DIR/prompts/implement.md" "$EXTRA_FILE" \
            | "$TPL_DIR/scripts/github-output.sh" text

      # Without --allowedTools the action denies Bash by default and the agent
      # cannot run git or the tests
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ inputs.show-full-output }}
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "${{ inputs.allowed-tools }}"
            --model ${{ inputs.model != '' && inputs.model || 'claude-opus-5-5' }}
            ${{ inputs.claude-args-extra }}
          prompt: ${{ steps.prompt.outputs.text }}

      # The plan step already labels and explains its own failure
      - name: Mark the issue as blocked if the run failed
        if: failure() && steps.plan.outcome != 'failure'
        env:
          LABEL_BLOCKED: ${{ inputs.label-blocked }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL_BLOCKED"
          gh issue comment "$ISSUE_NUMBER" --body "⚠️ patufet: the automatic implementation run failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # The action can finish green without having done anything (e.g. tool
      # denials): if there is no open PR and the issue is not to-refine, block it
      - name: Check that a PR exists (or the issue was marked to-refine)
        env:
          LABEL_BLOCKED: ${{ inputs.label-blocked }}
          LABEL_TO_REFINE: ${{ inputs.label-to-refine }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          # shellcheck disable=SC2016  # $l is a jq variable
          refine=$(gh issue view "$ISSUE_NUMBER" --json labels | jq -r --arg l "$LABEL_TO_REFINE" '[.labels[].name] | contains([$l])')
          if [ "$prs" -eq 0 ] && [ "$refine" != "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL_BLOCKED"
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ patufet: the run ended without opening a PR or marking the issue as \`$LABEL_TO_REFINE\`. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

      - name: Remove the in-progress label
        if: always()
        env:
          LABEL_IN_PROGRESS: ${{ inputs.label-in-progress }}
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "$LABEL_IN_PROGRESS" || true

      - name: Summary
        if: always() && env.TPL_DIR != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SETUP: ${{ steps.setup-plan.outputs.run == 'true' && format('{0} ({1})', steps.setup.outcome, steps.setup-plan.outputs.note) || steps.setup-plan.outputs.note }}
          DEPRECATED: ${{ inputs.java-version != '' && 'java-version ' || '' }}${{ inputs.node-version != '' && 'node-version' || '' }}
        run: |
          extra=()
          if [ -n "$DEPRECATED" ]; then
            echo "::warning::Deprecated input(s) $DEPRECATED: move them to .github/patufet/setup/action.yml (docs/customization.md#preparing-the-environment). They will be removed."
            extra+=("Deprecated inputs: $DEPRECATED → .github/patufet/setup/action.yml")
          fi
          "$TPL_DIR/scripts/run-summary.sh" implement "$EXECUTION_FILE" "Issue: #$ISSUE_NUMBER" "Branch: $BRANCH" "Project setup: ${SETUP:-not reached}" "${extra[@]}"
