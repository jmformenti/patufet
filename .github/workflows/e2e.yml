# patufet — e2e
#
# Live functional test of a PR that passed the code review: the consumer's
# `e2e-up.sh` hook starts the application, then Claude drives it with the
# Playwright MCP server and reports. Optional stage — only wire it if the
# application can be started on a GitHub runner. See docs/e2e.md.
name: patufet / e2e

on:
  workflow_call:
    inputs:
      up-script:
        description: Script (in the consumer repo) that starts the app, waits for it and seeds test data. Must write KEY=VALUE lines (URLs, test credentials) to $PATUFET_E2E_ENV
        type: string
        default: .github/patufet/e2e-up.sh
      down-script:
        description: Script that stops the app; always runs
        type: string
        default: .github/patufet/e2e-down.sh
      extra-instructions-file:
        description: What to test for this project (appended to the base prompt)
        type: string
        default: .github/patufet/e2e.md
      human-reviewer:
        description: GitHub login (without @) to mention when everything works, so they merge
        type: string
        default: ''
      branch-prefix:
        description: Branch prefix used by implement.yml, to find the linked issue
        type: string
        default: agent/issue-
      language:
        description: Language for the comments Claude writes (free text or ISO code)
        type: string
        default: en
      model:
        description: Claude model override (empty = action default)
        type: string
        default: ''
      max-turns:
        description: --max-turns for the agent
        type: number
        default: 200
      allowed-tools:
        description: --allowedTools for the agent. gh runs with the Claude App token, which can write (and merge); keep this list to reading, commenting and labelling
        type: string
        default: mcp__playwright__*,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*)
      allowed-bots:
        description: Bots whose events may trigger the run (the reviewer labels as "claude")
        type: string
        default: claude
      claude-args-extra:
        description: Extra arguments appended to claude_args
        type: string
        default: ''
      show-full-output:
        description: Show the full Claude transcript in the job log (may leak secrets printed by tools)
        type: boolean
        default: true
      install-playwright:
        description: Install the Playwright Chromium browser on the runner
        type: boolean
        default: true
      playwright-mcp-version:
        description: Version of @playwright/mcp; the browser installed is the one of the Playwright version it depends on
        type: string
        default: 0.0.82
      label-pass:
        description: Verdict label "pass" (the trigger of this stage)
        type: string
        default: pass
      label-warning:
        description: Verdict label "warning"
        type: string
        default: warning
      label-fail:
        description: Verdict label "fail" (sends the PR back to fix-review)
        type: string
        default: fail
      legacy-plan-heading:
        description: Also accept plan comments containing this heading (migration aid). Empty = marker only
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # A run based on a superseded verdict must never label after a newer one
    concurrency:
      group: patufet-e2e-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Identifies this run's report comment, so an earlier run's never counts
      RUN_KEY: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      # The exact commit that got the `pass` label, not whatever the branch
      # points to now
      - name: Checkout the PR head commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch patufet template
        run: |
          TPL_DIR="$RUNNER_TEMP/patufet"
          mkdir -p "$TPL_DIR"
          gh api "repos/$TEMPLATE_REPO/tarball/$TEMPLATE_SHA" > "$RUNNER_TEMP/template.tar.gz"
          tar -xzf "$RUNNER_TEMP/template.tar.gz" -C "$TPL_DIR" --strip-components=1
          rm -f "$RUNNER_TEMP/template.tar.gz"
          echo "TPL_DIR=$TPL_DIR" >> "$GITHUB_ENV"
          echo "patufet template $TEMPLATE_REPO@$TEMPLATE_SHA extracted to $TPL_DIR"
        env:
          TEMPLATE_REPO: ${{ job.workflow_repository }}
          TEMPLATE_SHA: ${{ job.workflow_sha }}

      - name: Start the application (e2e-up hook)
        env:
          UP_SCRIPT: ${{ inputs.up-script }}
        run: |
          PATUFET_E2E_ENV="$RUNNER_TEMP/e2e.env"
          echo "PATUFET_E2E_ENV=$PATUFET_E2E_ENV" >> "$GITHUB_ENV"
          export PATUFET_E2E_ENV
          if [ ! -f "$UP_SCRIPT" ]; then
            echo "::error::e2e up-script '$UP_SCRIPT' not found. See docs/e2e.md in patufet."
            exit 1
          fi
          : > "$PATUFET_E2E_ENV"
          bash "$UP_SCRIPT"
          echo "Environment exported by the hook:"
          sed 's/=.*/=…/' "$PATUFET_E2E_ENV"

      # The browser must match the Playwright version the MCP server is built
      # on. `timeout` + retries: on a real run the inner apt-get of this command
      # hung for 27 min against a flaky runner mirror until the job timed out
      - name: Install the Playwright browser
        if: inputs.install-playwright
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          MCP_VERSION: ${{ inputs.playwright-mcp-version }}
        run: |
          pw=$(npm view "@playwright/mcp@$MCP_VERSION" dependencies.playwright)
          echo "@playwright/mcp@$MCP_VERSION uses playwright@$pw"
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            timeout 300 npx -y "playwright@$pw" install --with-deps chromium && exit 0
            echo "Attempt $i failed or hung (5 min timeout)."
          done
          echo "All attempts failed."
          exit 1

      - name: Gather context (linked issue, approved plan)
        id: context
        env:
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
          LEGACY_HEADING: ${{ inputs.legacy-plan-heading }}
        run: '"$TPL_DIR/scripts/gather-context.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$BRANCH_PREFIX" "$LEGACY_HEADING" e2e "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"'

      - name: Render the prompt
        id: prompt
        env:
          TPL_pr: ${{ github.event.pull_request.number }}
          TPL_repository: ${{ github.repository }}
          TPL_language: ${{ inputs.language }}
          TPL_run: ${{ github.run_id }}.${{ github.run_attempt }}
          TPL_label_pass: ${{ inputs.label-pass }}
          TPL_label_warning: ${{ inputs.label-warning }}
          TPL_label_fail: ${{ inputs.label-fail }}
          EXTRA_FILE: ${{ inputs.extra-instructions-file }}
        run: |
          TPL_e2e_env="$(sed -E 's/^([^=]+)=(.*)$/- \1: \2/' "$PATUFET_E2E_ENV")"
          [ -n "$TPL_e2e_env" ] || TPL_e2e_env="(the up-script exported nothing)"
          export TPL_e2e_env
          TPL_plan_section="$(cat "$RUNNER_TEMP/plan_section.md")"; export TPL_plan_section
          "$TPL_DIR/scripts/render-prompt.sh" "$TPL_DIR/prompts/e2e.md" "$EXTRA_FILE" \
            | "$TPL_DIR/scripts/github-output.sh" text

      - name: Live functional test with Claude + Playwright MCP
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ inputs.allowed-bots }}
          show_full_output: ${{ inputs.show-full-output }}
          claude_args: |
            --max-turns ${{ inputs.max-turns }}
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@${{ inputs.playwright-mcp-version }}","--headless"]}}}'
            --allowedTools "${{ inputs.allowed-tools }}"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            ${{ inputs.claude-args-extra }}
          prompt: ${{ steps.prompt.outputs.text }}

      # On failure Claude itself relabels the PR `fail` inside the action (app
      # token → fix-review triggers; the token is revoked when the action ends).
      # This step verifies/repairs the label and, on success, asks the human
      # reviewer to merge. Not on cancellation: a superseded run must not label.
      - name: Apply the e2e verdict
        id: verdict
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          LABEL_PASS: ${{ inputs.label-pass }}
          LABEL_WARNING: ${{ inputs.label-warning }}
          LABEL_FAIL: ${{ inputs.label-fail }}
          REVIEWER: ${{ inputs.human-reviewer }}
        run: |
          if [ -z "$CLAUDE_EXECUTION_FILE" ]; then
            echo "::error::The Claude action did not run (see its step log). No verdict."
            exit 1
          fi
          verdict=$("$TPL_DIR/scripts/read-verdict.sh" e2e "$GITHUB_REPOSITORY" "$PR_NUMBER" "run=$RUN_KEY")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ -z "$verdict" ] || [ "$CLAUDE_OUTCOME" != "success" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ patufet: the live e2e run produced no verdict (outcome: $CLAUDE_OUTCOME). Manual check needed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi
          if [ "$verdict" = "fail" ]; then
            if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qxF "$LABEL_FAIL"; then
              echo "e2e failed and the PR is labelled '$LABEL_FAIL'."
            else
              echo "::warning::e2e failed but the PR is not labelled '$LABEL_FAIL'; repairing with GITHUB_TOKEN — fix-review will NOT be triggered automatically"
              "$TPL_DIR/scripts/set-verdict-label.sh" "$PR_NUMBER" fail "$LABEL_PASS" "$LABEL_WARNING" "$LABEL_FAIL"
              gh pr comment "$PR_NUMBER" --body "⚠️ patufet: the e2e tester reported a failure but did not relabel the PR; the label was repaired by the workflow, which cannot trigger the next stage. Remove and re-add the \`$LABEL_FAIL\` label by hand to continue."
            fi
          else
            mention=""
            [ -n "$REVIEWER" ] && mention=" @$REVIEWER"
            gh pr comment "$PR_NUMBER" --body "✅ patufet: code review and live e2e test passed. Ready for human review and merge.$mention"
          fi

      - name: Stop the application (e2e-down hook)
        if: always()
        env:
          DOWN_SCRIPT: ${{ inputs.down-script }}
        run: |
          if [ -f "$DOWN_SCRIPT" ]; then bash "$DOWN_SCRIPT"; else echo "No down-script '$DOWN_SCRIPT'; nothing to stop."; fi

      - name: Summary
        if: always() && env.TPL_DIR != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: '"$TPL_DIR/scripts/run-summary.sh" e2e "$EXECUTION_FILE" "PR: #$PR_NUMBER" "Verdict: ${VERDICT:-none}"'
