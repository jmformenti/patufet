# patufet — autonomous issue → PR → review → fix → e2e flow.
# Installed by scripts/bootstrap.sh from https://github.com/jmformenti/patufet
#
# Everything project-specific lives in the `with:` blocks below and in
# .github/patufet/*.md (prompt extensions) and *.sh (e2e hooks).
# Reference of every input: https://github.com/jmformenti/patufet/blob/main/docs/customization.md
name: patufet

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement (must have an approved plan comment)
        required: true
        type: number

jobs:
  # ready-to-implement → branch + PR
  implement:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ready-to-implement')
    uses: jmformenti/patufet/.github/workflows/implement.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      issue-number: ${{ fromJSON(inputs.issue || github.event.issue.number) }}
      language: en
      # Build and test: the agent reproduces your CI workflows, or else what AGENTS.md / CLAUDE.md
      # say. Set java-version / node-version, here and in pull-request, if CI pins them.

  # everything patufet does with a pull request, as jobs of one run: wait for the CI of
  # the commit (every other workflow that runs on it) and review → verdict label →
  # fix-review (warning / fail) or e2e (pass) → fix-e2e (e2e failed). A person adding a
  # verdict label starts the stage that follows it.
  pull-request:
    if: github.event_name == 'pull_request'
    uses: jmformenti/patufet/.github/workflows/pull-request.yml@v1
    permissions: # the most a stage needs; each stage narrows them
      contents: write # fix-review pushes; review and e2e only read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # the CI runs of the commit and the logs of failed jobs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      language: en
      human-reviewer: ""
      max-review-cycles: 10
      # live e2e after a pass: needs .github/patufet/e2e-up.sh to start the app (docs/e2e.md)
      e2e: false
